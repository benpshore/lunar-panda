name: Release

# Publish: push a tag, e.g. `git tag v0.1.1 && git push --tags`.
# Every merge to main is also released automatically by auto-release.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Tag matches computed project version
        run: test "$(uvx uv-dynamic-versioning)" = "${GITHUB_REF_NAME#v}"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv audit --locked --preview-features audit-command
      - run: uv build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
